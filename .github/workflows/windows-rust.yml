name: Windows Rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-binaries:
    name: Release binaries
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check server and CLI
        run: cargo check -p cowchat-server -p cowchat-cli

      - name: Build release binaries
        run: cargo build --release -p cowchat-server -p cowchat-cli

      - name: Stage release binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/windows -Force
          Copy-Item target/release/cowchat.exe dist/windows/
          Copy-Item target/release/cowchat-server.exe dist/windows/

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: cowchat-windows-x86_64
          path: dist/windows/

  server-cli-tests:
    name: Server and CLI tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test server
        run: cargo test -p cowchat-server

      - name: Test CLI
        run: cargo test -p cowchat-cli
