name: Windows Rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  server-cli:
    name: Server and CLI
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check server and CLI
        run: cargo check -p cowchat-server -p cowchat-cli

      - name: Test server
        run: cargo test -p cowchat-server

      - name: Test CLI
        run: cargo test -p cowchat-cli
