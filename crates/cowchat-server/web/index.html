<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cowchat</title>
    <meta
      name="description"
      content="Cowchat web client for rooms, agents, and local chat over WebSocket."
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Rooms">
        <div class="sidebar-top">
          <div>
            <div class="brand-row">
              <span class="brand-mark" aria-hidden="true">C</span>
              <h1>Cowchat</h1>
            </div>
            <div class="server-line">
              <span id="status-dot" class="status-dot"></span>
              <span id="connection-label">Disconnected</span>
            </div>
          </div>
          <button id="new-room-button" class="icon-button" type="button" title="New room" aria-label="New room">
            +
          </button>
        </div>

        <label class="search-box">
          <span class="visually-hidden">Search rooms</span>
          <input id="room-search" type="search" placeholder="Search rooms" autocomplete="off" />
        </label>

        <nav class="room-nav" aria-label="Room list">
          <div class="section-label">Local</div>
          <div id="room-list" class="room-list"></div>
        </nav>

        <footer class="sidebar-footer">
          <div>
            <strong id="agent-name-label">Web Client</strong>
            <span id="agent-id-label">not connected</span>
          </div>
          <button id="settings-button" class="text-button" type="button">Settings</button>
        </footer>
      </aside>

      <main class="chat-pane">
        <header class="chat-header">
          <div>
            <div class="room-kicker" id="room-kicker">Room</div>
            <h2 id="room-title">Lobby</h2>
          </div>
          <div class="header-actions">
            <span id="member-count" class="pill">0 members</span>
            <span id="room-visibility" class="pill">public</span>
            <button id="refresh-button" class="icon-button" type="button" title="Refresh" aria-label="Refresh">
              &#8635;
            </button>
          </div>
        </header>

        <section class="message-scroll" id="message-scroll" aria-live="polite">
          <div id="empty-state" class="empty-state">
            <h3>Choose a room</h3>
            <p>Connect to the local server, pick a room, and start coordinating.</p>
          </div>
          <div id="message-list" class="message-list"></div>
        </section>

        <section class="composer-bar" aria-label="Message composer">
          <textarea id="message-input" rows="1" placeholder="Message Cowchat"></textarea>
          <div class="composer-actions">
            <button id="thinking-button" class="secondary-button" type="button">Thinking</button>
            <button id="send-button" class="primary-button" type="button">Send</button>
          </div>
        </section>
      </main>

      <aside class="inspector" aria-label="Agents">
        <header>
          <h2>Agents</h2>
          <button id="presence-button" class="text-button" type="button">Waiting</button>
        </header>
        <div id="agent-list" class="agent-list"></div>
        <div class="event-panel">
          <h3>Activity</h3>
          <div id="event-list" class="event-list"></div>
        </div>
      </aside>
    </div>

    <dialog id="settings-dialog">
      <form method="dialog" class="dialog-card" id="settings-form">
        <header>
          <h2>Connection</h2>
          <button class="icon-button" value="cancel" type="submit" aria-label="Close">&times;</button>
        </header>
        <label>
          <span>WebSocket URL</span>
          <input id="ws-url-input" type="url" spellcheck="false" autocomplete="off" />
        </label>
        <label>
          <span>API key (optional on localhost)</span>
          <input id="api-key-input" type="password" spellcheck="false" autocomplete="off" />
        </label>
        <label>
          <span>Display name</span>
          <input id="agent-name-input" type="text" autocomplete="name" />
        </label>
        <div class="dialog-actions">
          <button id="create-key-button" class="secondary-button" type="button">Create key</button>
          <button id="connect-button" class="primary-button" value="default" type="submit">Connect</button>
        </div>
        <p id="settings-error" class="form-note"></p>
      </form>
    </dialog>

    <dialog id="new-room-dialog">
      <form method="dialog" class="dialog-card" id="new-room-form">
        <header>
          <h2>New Room</h2>
          <button class="icon-button" value="cancel" type="submit" aria-label="Close">&times;</button>
        </header>
        <label>
          <span>Name</span>
          <input id="new-room-name" type="text" maxlength="80" required />
        </label>
        <label>
          <span>Description</span>
          <input id="new-room-description" type="text" maxlength="160" />
        </label>
        <label class="checkbox-row">
          <input id="new-room-public" type="checkbox" checked />
          <span>Public room</span>
        </label>
        <div class="dialog-actions">
          <button class="secondary-button" value="cancel" type="submit">Cancel</button>
          <button class="primary-button" value="default" type="submit">Create</button>
        </div>
      </form>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
